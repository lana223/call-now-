<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmation Preview</title>
<style>
:root{--bg:#faf9f4;--fg:#23352d;--card:#fffefa;--muted:#68746d;--border:#dfe3dc;--primary:#824bd2;--green:#dfeee5;--deep:#243b31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(720px,100%);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px;box-shadow:0 25px 70px rgba(30,55,45,.12)}.success{text-align:center;padding:24px 8px}.check{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:var(--green);color:var(--deep);font-size:30px;font-weight:700}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:700;color:var(--primary);margin:0 0 12px}.success h1{font-size:40px;margin:0 0 12px}.sub{color:var(--muted);margin:10px 0 0;line-height:1.6}.notice{max-width:450px;margin:25px auto;padding:16px;text-align:left;background:#f6ead0;border:1px solid #ecd49e;border-radius:8px}.notice ul{margin:10px 0 0;padding-left:20px;color:var(--muted)}.done{border:0;border-radius:8px;padding:13px 24px;background:var(--primary);color:white;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main class="card">
<div class="success">
<div class="check">✓</div>
<p class="eyebrow">Confirmation</p>
<h1>You're booked.</h1>
<p class="sub">Your strategy call is confirmed for<br><b>Mon Oct 05 2026</b> at <b>11:00 AM</b><br>with Raouf or Michael</p>
<div class="notice"><b>Before the call</b><ul><li>Your current number of units</li><li>What you want to achieve</li><li>The biggest blocker in your operation</li></ul></div>
<button class="done" type="button">Done</button>
</div>
</main>
</body>
</html>

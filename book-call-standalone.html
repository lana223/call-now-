<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a Strategy Call</title>
<style>
:root{--bg:#faf9f4;--fg:#23352d;--card:#fffefa;--muted:#68746d;--border:#dfe3dc;--primary:#824bd2;--deep:#243b31;--cream:#f2c276;--green:#dfeee5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;min-height:100vh}.page{min-height:100vh;display:grid;place-items:center;padding:32px}.shell{width:min(680px,100%)}.brand{font-weight:800;letter-spacing:.12em;color:#fff;background:var(--deep);display:inline-block;padding:12px 16px;border-radius:6px;margin-bottom:22px}.dialog{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:34px;box-shadow:0 24px 70px rgba(30,55,45,.14)}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:700;color:var(--primary);margin:0 0 12px}.head h1{font-size:36px;line-height:1.05;margin:0}.head p{color:var(--muted);margin:10px 0 0}.close{border:0;background:transparent;font-size:26px;color:var(--muted);cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;height:46px;margin-top:7px;border:1px solid var(--border);border-radius:7px;padding:0 12px;background:#fff;color:var(--fg)}.full{grid-column:1/-1}.notice{padding:14px;background:#f6ead0;border:1px solid #ecd49e;border-radius:8px;font-size:13px}.btn{border:0;padding:14px 20px;border-radius:8px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.calendar{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.box{border:1px solid var(--border);border-radius:8px;padding:18px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.days button,.times button{border:1px solid var(--border);background:#fff;border-radius:7px;padding:10px;cursor:pointer}.days button.active,.times button.active{background:var(--green);border-color:#9ab8a4}.times{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.confirm{width:100%;margin-top:18px}.success{text-align:center;padding:20px 0}.check{font-size:48px;color:var(--primary)}.success h1{font-size:40px;margin:8px 0}.success p{color:var(--muted)}@media(max-width:650px){.page{padding:16px}.dialog{padding:24px}.form,.calendar{grid-template-columns:1fr}.full{grid-column:auto}.head h1{font-size:30px}}
</style>
</head>
<body>
<div class="page"><main class="shell">
<div class="brand">THE FLEX · ACADEMY</div>
<section class="dialog" id="app"></section>
</main></div>
<script>
const app=document.getElementById('app');let date='',time='';
function form(){app.innerHTML=`<div class="head"><div><p class="eyebrow">Strategy call</p><h1>Book your free strategy call</h1><p>20–30 min · no pitch</p></div></div><form class="form" onsubmit="event.preventDefault();calendar()"><div class="field"><label>Name</label><input required placeholder="Your name"></div><div class="field"><label>Email</label><input type="email" required placeholder="you@example.com"></div><div class="field"><label>Units today</label><select required><option value="">Choose a range</option><option>0</option><option>1–2</option><option>3–10</option><option>11–30</option><option>30+</option></select></div><div class="field"><label>Target</label><select required><option value="">Choose your target</option><option>Double my units</option><option>Automate operations</option><option>Improve margins</option></select></div><div class="field"><label>City (optional)</label><input placeholder="e.g. London"></div><div class="field"><label>Budget band</label><select required><option value="">Choose a range</option><option>Still exploring</option><option>Under $5,000</option><option>$5,000–$10,000</option><option>$10,000+</option></select></div><div class="notice full">You're booking a conversation about your operation, not a sales pitch.</div><button class="btn primary full">Choose a time →</button></form>`}
function calendar(){let d=new Date(),items='';for(let i=1;i<=20;i++){let x=new Date(d);x.setDate(d.getDate()+i);if(x.getDay()===0||x.getDay()===6)continue;let label=x.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});items+=`<button type="button" onclick="pickDate('${label}',this)">${label}</button>`}app.innerHTML=`<div class="head"><div><p class="eyebrow">Pick a time</p><h1>Choose your call time</h1><p>Times shown in your local time.</p></div></div><div class="calendar"><div class="box"><b>Choose a date</b><div class="days">${items}</div></div><div class="box"><b>${date||'Choose a date'}</b><div class="times">${['9:30 AM','11:00 AM','2:00 PM','4:30 PM'].map(t=>`<button type="button" onclick="pickTime('${t}',this)">${t}</button>`).join('')}</div><button class="btn primary confirm" id="confirm" disabled onclick="done()">Confirm time →</button></div></div>`}
function pickDate(v,el){date=v;document.querySelectorAll('.days button').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function pickTime(v,el){time=v;document.querySelectorAll('.times button').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('confirm').disabled=false}
function done(){app.innerHTML=`<div class="success"><div class="check">✓</div><p class="eyebrow">Confirmed</p><h1>You're booked.</h1><p>${date} · ${time}<br>with Raouf or Michael</p><div class="notice" style="text-align:left;margin:24px auto;max-width:430px"><b>What to prepare</b><ul><li>Your number of units</li><li>Your target</li><li>Your biggest blocker</li></ul></div><button class="btn primary" onclick="form()">Book another call</button></div>`}
form();
</script>
</body></html>
